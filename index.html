<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ROYAL FORTUNE QUEST – Hành trình trở thành Đế vương</title>
<style>
:root{
  --navy:#0b1230; --navy2:#16224f; --purple:#3a1c6e; --purple2:#5b2fa0;
  --gold:#f2c14e; --gold-l:#ffe69a; --gold-d:#b57d10; --bronze:#8a5a08;
  --crimson:#8c1d2f; --crimson-l:#c42b45; --cream:#fff6dc; --green:#2e9e5b; --ink:#2a1d0a;
  --gold-grad:linear-gradient(180deg,#fff0a8 0%,#f6c744 48%,#c88a14 100%);
  --font-display:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --font-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{font-family:var(--font-body);background:var(--navy);color:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}
.screen{display:none;min-height:100vh;position:relative}
.screen.active{display:flex}

/* ---------- buttons ---------- */
.btn-gold{background:var(--gold-grad);color:#3b2605;border:2px solid var(--bronze);border-radius:14px;padding:.75em 1.6em;font-weight:800;letter-spacing:.05em;box-shadow:0 4px 0 var(--bronze),0 10px 22px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s,filter .12s}
.btn-gold:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
.btn-gold:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--bronze),0 4px 10px rgba(0,0,0,.35)}
.btn-gold:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
.btn-gold.big{font-size:clamp(18px,2vw,24px);padding:.8em 2em;width:100%}
.btn-gold.sm,.btn-ghost.sm,.btn-red.sm{font-size:14px;padding:.55em 1.1em;border-radius:10px;box-shadow:0 3px 0 var(--bronze)}
.btn-ghost{background:rgba(255,255,255,.08);border:2px solid #f2c14e99;border-radius:12px;padding:.6em 1.2em;font-weight:700;color:var(--cream);transition:background .15s}
.btn-ghost:hover{background:rgba(242,193,78,.18)}
.btn-red{background:linear-gradient(180deg,#d6344e,#8c1d2f);border:2px solid #5d0f1d;color:#fff;border-radius:12px;font-weight:700;padding:.6em 1.2em;box-shadow:0 3px 0 #5d0f1d}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid #f2c14e99;background:rgba(11,18,48,.7);font-size:20px;display:grid;place-items:center;color:var(--cream)}
.icon-btn:hover{background:rgba(242,193,78,.2)}
.err{color:#ff9aa9;font-weight:600;min-height:1.3em;font-size:14px}

/* ---------- start screen ---------- */
#screen-start{align-items:center;justify-content:center;overflow:hidden;background:#0a0f2b}
.scene{position:absolute;inset:0;width:100%;height:100%}
.start-ui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px;width:100%;max-width:1000px}
.sound-top{position:absolute;top:16px;right:16px;z-index:3}
.crown-hero{width:clamp(84px,11vw,130px);height:auto;filter:drop-shadow(0 6px 14px rgba(242,193,78,.55));animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.9vw,54px);line-height:1.1;white-space:nowrap;letter-spacing:.07em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5d3a05) drop-shadow(0 8px 18px rgba(0,0,0,.6));margin-top:6px}
.subtitle{font-family:var(--font-display);font-weight:700;letter-spacing:.22em;font-size:clamp(13px,1.7vw,20px);color:var(--gold-l);margin:10px 0 22px;text-shadow:0 2px 8px #000}
.panel{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(22,34,79,.9),rgba(14,20,52,.92));border:2px solid var(--gold);border-radius:20px;padding:22px 22px 18px;box-shadow:0 0 0 4px rgba(242,193,78,.18),0 20px 50px rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.panel label{display:block;text-align:left;font-weight:700;color:var(--gold-l);margin-bottom:8px}
.panel input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #f2c14e88;background:#0b1230;color:var(--cream);font-size:20px}
.panel input::placeholder{color:#a8a3c8}
.panel .err{text-align:left;margin:6px 0 8px}
.rules{margin-top:14px;font-size:14px;color:#d9d3f2;line-height:1.55}
.rules b{color:var(--gold-l)}
.btn-teacher{position:absolute;left:16px;top:16px;z-index:3;background:rgba(11,18,48,.8);border:1.5px solid #f2c14e88;color:var(--gold-l);padding:.55em 1.1em;border-radius:10px;font-weight:700;letter-spacing:.06em;font-size:13px}
.btn-teacher:hover{background:rgba(242,193,78,.2)}
.deco{position:absolute;z-index:1;pointer-events:none;bottom:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.deco.chest{left:clamp(0px,3vw,60px);width:clamp(130px,20vw,280px)}
.deco.gems{left:clamp(110px,22vw,320px);width:clamp(70px,9vw,130px);bottom:6px}
.deco.throne{right:clamp(6px,5vw,90px);width:clamp(90px,13vw,190px)}
.deco.scepter{right:clamp(100px,19vw,290px);width:clamp(26px,3.6vw,52px);bottom:4px}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- game screen ---------- */
#screen-game{flex-direction:column;background:radial-gradient(circle at 15% 0,rgba(91,47,160,.55),transparent 55%),radial-gradient(circle at 90% 100%,rgba(140,29,47,.35),transparent 50%),linear-gradient(180deg,#0b1230,#18134a)}
.hud{display:grid;grid-template-columns:1.2fr auto 1.2fr auto;gap:14px;align-items:center;padding:12px 20px;background:rgba(8,12,34,.75);border-bottom:2px solid #f2c14e88}
.player{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:clamp(17px,1.8vw,24px);color:var(--gold-l);min-width:0}
.player svg{width:34px;height:28px;flex:none}
.player span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{margin-top:6px;font-size:14px;color:#d9d3f2}
.progress .bar{height:8px;border-radius:6px;background:#ffffff22;margin-top:5px;overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--gold-grad);border-radius:6px;transition:width .4s}
.timer{display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 20px;border-radius:999px;border:2px solid var(--gold);background:#0b1230;font-weight:800;font-size:clamp(22px,2.6vw,32px);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--gold-l)}
.timer.warn{background:var(--crimson);border-color:#ff9aa9;color:#fff;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.wallet{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.wallet .icon{width:64px;height:54px;flex:none}
.wallet .amt{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,2.8vw,36px);color:var(--gold-l);line-height:1;font-variant-numeric:tabular-nums}
.wallet .lbl{font-size:12px;color:#d9d3f2;letter-spacing:.08em}
.wallet.bump .icon{animation:bump .5s}
.wallet.shake .icon{animation:shake .5s}
@keyframes bump{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.delta{display:inline-block;margin-top:5px;padding:2px 10px;border-radius:999px;font-weight:800;font-size:14px;background:#ffffff1a;color:#d9d3f2;font-variant-numeric:tabular-nums}
.delta.pos{background:#1f7a46;color:#d7ffe6}
.delta.neg{background:var(--crimson-l);color:#fff}
.delta.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:22px 20px 26px;display:flex;flex-direction:column;gap:18px}
.qcard{position:relative;padding:22px 28px 24px;border-radius:20px;border:2px solid var(--gold);background:linear-gradient(180deg,rgba(58,28,110,.85),rgba(22,34,79,.9));box-shadow:0 0 0 5px rgba(242,193,78,.14),0 16px 36px rgba(0,0,0,.45)}
.qno{display:inline-block;font-family:var(--font-display);font-weight:800;color:#3b2605;background:var(--gold-grad);padding:3px 16px;border-radius:999px;font-size:15px;letter-spacing:.06em;margin-bottom:10px}
.qcard h2{font-weight:700;line-height:1.4;font-size:clamp(20px,2.4vw,30px);color:#fff}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:76px;border-radius:16px;border:2px solid #b8891e99;background:linear-gradient(180deg,#1d2c66,#121c47);color:var(--cream);text-align:left;font-size:clamp(16px,1.65vw,22px);line-height:1.35;transition:transform .12s,border-color .12s,box-shadow .12s,background .12s}
.opt .letter{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold-grad);color:#3b2605;font:800 22px var(--font-display);display:grid;place-items:center;box-shadow:0 2px 0 var(--bronze)}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.opt.selected{border-color:var(--gold-l);background:linear-gradient(180deg,#6a38b4,#3a1c6e);box-shadow:0 0 0 3px #f2c14e55,0 0 26px #f2c14e66}
.opt.right{background:linear-gradient(180deg,#2e9e5b,#1b6a3d);border-color:#a8f5c6;box-shadow:0 0 22px #3ddc8a77}
.opt.wrong{background:linear-gradient(180deg,#c42b45,#8c1d2f);border-color:#ffb0bc}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong):not(.selected){opacity:.55}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.actions .btn-gold{min-width:240px;font-size:20px}
.feedback{display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-radius:16px;border:2px solid;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.feedback.ok{background:rgba(31,122,70,.35);border-color:#6be2a0}
.feedback.no{background:rgba(196,43,69,.3);border-color:#ff9aa9}
.feedback .fb-title{font-family:var(--font-display);font-weight:800;font-size:clamp(20px,2.2vw,28px)}
.feedback .fb-line{font-size:clamp(15px,1.5vw,19px);line-height:1.5}
.feedback .fb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.warn-banner{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:50;background:var(--crimson-l);color:#fff;font-weight:800;padding:10px 26px;border-radius:999px;border:2px solid #ffb0bc;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .3s ease-out}
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(8,12,34,.82);font-family:var(--font-display);font-weight:800;font-size:clamp(36px,8vw,90px);color:var(--gold-l);letter-spacing:.08em;text-shadow:0 4px 0 #5d3a05,0 10px 30px #000;animation:rise .3s}

/* ---------- result screen ---------- */
#screen-result{justify-content:center;align-items:flex-start;background:radial-gradient(circle at 50% -10%,rgba(242,193,78,.28),transparent 55%),linear-gradient(180deg,#0b1230,#241062 70%,#3a1c6e);overflow-x:hidden}
.result-wrap{position:relative;z-index:2;width:100%;max-width:1100px;padding:16px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.result-wrap h2{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3.4vw,42px);letter-spacing:.06em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5d3a05)}
.result-main{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.medal{position:relative;width:clamp(190px,24vw,270px);aspect-ratio:1;display:grid;place-items:center}
.medal::before{content:"";position:absolute;inset:-26%;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,230,154,.0),rgba(255,230,154,.55),rgba(255,230,154,0) 25%,rgba(255,230,154,.55) 50%,rgba(255,230,154,0) 75%,rgba(255,230,154,.55),rgba(255,230,154,0));-webkit-mask:radial-gradient(circle,#000 38%,transparent 70%);mask:radial-gradient(circle,#000 38%,transparent 70%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.medal img{position:relative;width:100%;filter:drop-shadow(0 0 22px rgba(255,214,102,.8)) drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:float 3.6s ease-in-out infinite}
.stats{min-width:290px;padding:18px 22px;border-radius:18px;border:2px solid var(--gold);background:rgba(11,18,48,.7);box-shadow:0 0 0 4px rgba(242,193,78,.14)}
.stats .who{font-family:var(--font-display);font-size:clamp(20px,2.2vw,28px);font-weight:800;color:var(--gold-l);margin-bottom:6px;word-break:break-word}
.stats .rank-name{font-weight:800;letter-spacing:.08em;margin-bottom:10px;color:#fff}
.stats dl{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:clamp(15px,1.5vw,18px)}
.stats dd{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.stats .total{grid-column:1/-1;gap:14px;margin-top:6px;padding-top:10px;border-top:1px dashed #f2c14e88;display:flex;justify-content:space-between;align-items:baseline;font-size:clamp(17px,1.7vw,21px)}
.stats .total b{font-family:var(--font-display);font-size:clamp(26px,3vw,38px);color:var(--gold-l)}
.congrats{max-width:760px;text-align:center;font-size:clamp(17px,1.8vw,22px);line-height:1.5;font-weight:600}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%}
.rank-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 10px;border-radius:16px;border:2px solid #f2c14e44;background:rgba(11,18,48,.55);opacity:.62;filter:saturate(.7);transition:transform .2s}
.rank-card img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain}
.rank-card .range{font-size:clamp(12px,1.15vw,14px);color:#d9d3f2;text-align:center;line-height:1.3}
.rank-card.you{opacity:1;filter:none;transform:translateY(-6px) scale(1.06);border:3px solid var(--gold-l);background:linear-gradient(180deg,rgba(242,193,78,.28),rgba(91,47,160,.45));box-shadow:0 0 0 4px rgba(242,193,78,.3),0 0 34px rgba(255,214,102,.75);overflow:hidden}
.rank-card.you::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.rank-card .tag{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--gold-grad);color:#3b2605;font-weight:800;font-size:11px;padding:2px 10px;border-radius:0 0 10px 10px;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.fly-coin{position:fixed;width:28px;height:28px}
.fly-coin svg{width:100%;height:100%;filter:drop-shadow(0 0 6px #ffd45a)}
.rain-coin{position:absolute;top:-40px;width:26px;height:26px;animation:fall linear forwards}
.rain-coin svg{width:100%;height:100%}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.float-delta{position:fixed;font-family:var(--font-display);font-weight:800;font-size:30px;color:#ff9aa9;text-shadow:0 2px 6px #000;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}

/* ---------- modal / toast ---------- */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(5,8,25,.75);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:100%;max-width:440px;background:#fbf3df;color:var(--ink);border-radius:18px;border:3px solid var(--gold);box-shadow:0 24px 60px rgba(0,0,0,.6);padding:22px;animation:rise .25s}
.modal.wide{max-width:640px}
.modal h3{font-family:var(--font-display);font-size:22px;margin-bottom:12px;color:#4a2a8a}
.modal-body{display:flex;flex-direction:column;gap:10px;line-height:1.5}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.modal label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:5px}
.modal input[type=text],.modal input[type=password],.modal textarea{padding:10px 12px;border-radius:10px;border:2px solid #cdb67a;background:#fff;font-size:16px;color:var(--ink);width:100%}
.modal textarea{resize:vertical}
.modal .err{color:#b3243b}
.modal .btn-ghost{color:var(--ink);background:#eadfbd;border-color:#cdb67a}
.shake{animation:shake .4s}
.ans-row{display:flex;align-items:center;gap:10px}
.ans-row .radio{flex-direction:row;align-items:center;gap:6px;cursor:pointer}
.ans-row .letter{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--purple2);color:#fff;font-weight:800}
.ans-row input[type=radio]{width:20px;height:20px;accent-color:#2e9e5b}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:120;background:#1b6a3d;color:#fff;font-weight:700;padding:12px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:rise .25s;max-width:90vw}
.toast.bad{background:var(--crimson)}

/* ---------- teacher mode ---------- */
#screen-teacher{background:linear-gradient(180deg,#0b1230,#241062);justify-content:center;align-items:flex-start;padding:16px}
.t-wrap{width:100%;max-width:980px;background:#fbf3df;color:var(--ink);border-radius:20px;border:3px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 32px)}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;background:linear-gradient(180deg,#3a1c6e,#241062);color:var(--cream);position:sticky;top:0;z-index:5}
.t-head h2{font-family:var(--font-display);letter-spacing:.08em;color:var(--gold-l);font-size:24px}
.t-head p{font-size:13px;color:#d9d3f2}
.t-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dirty{font-size:13px;font-weight:700;color:#ffd45a}
.t-tabs{display:flex;gap:4px;padding:10px 16px 0;background:#eadfbd;flex-wrap:wrap}
.t-tab{padding:10px 18px;border:0;border-radius:10px 10px 0 0;background:transparent;font-weight:700;color:#5a4a20}
.t-tab.on{background:#fbf3df;color:#4a2a8a;box-shadow:0 -2px 0 var(--gold) inset}
.t-body{padding:20px 22px 30px;flex:1}
.t-body h3{font-family:var(--font-display);color:#4a2a8a;margin-bottom:6px;font-size:20px}
.t-note{font-size:14px;color:#6b5a2e;margin-bottom:14px;line-height:1.5}
.q-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.q-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:2px solid #e0cf9c;background:#fff;margin-bottom:10px}
.q-num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--purple2);color:#fff;font-weight:800;display:grid;place-items:center}
.q-main{flex:1;min-width:0}
.q-text{font-weight:700;line-height:1.4}
.q-ans{font-size:14px;color:#2a7a4b;margin-top:3px}
.q-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.q-btns button{padding:6px 11px;border-radius:8px;border:1.5px solid #cdb67a;background:#f6ecce;font-weight:700;color:var(--ink)}
.q-btns button:hover:not(:disabled){background:#eadfbd}
.q-btns button:disabled{opacity:.35;cursor:not-allowed}
.q-btns .del{color:#b3243b}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px}
.field input[type=number],.field input[type=text],.field input[type=password]{padding:10px 12px;border-radius:10px;border:2px solid #cdb67a;background:#fff;font-size:16px;color:var(--ink)}
.field small{font-weight:400;color:#6b5a2e}
.field.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:600}
.field.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--purple2)}
.rank-edit{display:flex;align-items:center;gap:14px;padding:10px 14px;border:2px solid #e0cf9c;border-radius:12px;background:#fff;margin-bottom:10px}
.rank-edit img{width:70px;height:70px;object-fit:contain;flex:none}
.rank-edit .field{flex:1}
.t-section{padding:16px;border:2px solid #e0cf9c;border-radius:14px;background:#fff;margin-bottom:16px}
.t-section .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.t-section .btn-ghost{color:var(--ink);background:#f6ecce;border-color:#cdb67a}

@media (max-width:860px){
  .title{white-space:normal;font-size:clamp(28px,7vw,44px)}
  .hud{grid-template-columns:1fr auto;gap:8px}
  .options{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(3,1fr)}
  .deco.gems,.deco.scepter{display:none}
}
@media (max-height:760px){
  .stage{gap:12px;padding-top:14px}
  .qcard{padding:16px 22px}
  .opt{min-height:64px;padding:10px 16px}
  .rank-card img{max-width:110px}
  .medal{width:190px}
  .rank-card img{max-width:96px}
  .result-wrap h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

const $ = (s, r = document) => r.querySelector(s);

const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ---- Công thức tính tài sản & xếp hạng (hàm thuần, dễ kiểm tra) ---- */
function calcWealth(correct, wrong, cfg) {
  return Math.max(0, cfg.startWealth + correct * cfg.reward - wrong * cfg.penalty);
}
function rankFor(wealth, r) {
  if (wealth >= r.king) return "king";
  if (wealth >= r.minister) return "minister";
  if (wealth >= r.magistrate) return "magistrate";
  if (wealth >= r.rich) return "rich";
  return "commoner";
}
function rangeText(id, r) {
  switch (id) {
    case "king": return "Từ " + fmt(r.king) + " xu";
    case "minister": return fmt(r.minister) + " đến dưới " + fmt(r.king) + " xu";
    case "magistrate": return fmt(r.magistrate) + " đến dưới " + fmt(r.minister) + " xu";
    case "rich": return fmt(r.rich) + " đến dưới " + fmt(r.magistrate) + " xu";
    default: return "Dưới " + fmt(r.rich) + " xu";
  }
}

function validQuestion(q) {
  return q && typeof q.question === "string" && q.question.trim() &&
    Array.isArray(q.answers) && q.answers.length === 4 && q.answers.every(a => typeof a === "string" && a.trim()) &&
    Number.isInteger(q.correctAnswer) && q.correctAnswer >= 0 && q.correctAnswer <= 3;
}
function cleanQuestion(q) {
  return { question: q.question.trim(), answers: q.answers.map(a => a.trim()), correctAnswer: q.correctAnswer, explanation: (typeof q.explanation === "string" ? q.explanation.trim() : "") };
}
function loadState() {
  const s = clone(DEFAULTS);
  try {
    const raw = lsGet(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (typeof d.password === "string" && d.password) s.password = d.password;
      if (d.settings) Object.keys(s.settings).forEach(k => { if (typeof d.settings[k] === typeof s.settings[k]) s.settings[k] = d.settings[k]; });
      if (d.ranks) Object.keys(s.ranks).forEach(k => { if (Number.isFinite(d.ranks[k])) s.ranks[k] = d.ranks[k]; });
      if (Array.isArray(d.questions)) { const qs = d.questions.filter(validQuestion).map(cleanQuestion); if (qs.length) s.questions = qs; }
    }
  } catch (e) { /* dùng mặc định */ }
  s.questions = s.questions.map(cleanQuestion);
  return s;
}
function persist(s) { return lsSet(STORE_KEY, JSON.stringify(s)); }

let audioCtx = null, soundOn = lsGet(SOUND_KEY) !== "off";
function ac() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type, vol) {
  if (!soundOn) return; const c = ac(); if (!c) return;
  const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .15, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
}

  const s = state.settings, n = Math.min(s.numQuestions, state.questions.length);
  const t = Number.isInteger(s.timeMinutes) ? s.timeMinutes : String(s.timeMinutes).replace(".", ",");
  $("#start-rules").innerHTML = "Mỗi lượt gồm <b>" + n + " câu hỏi</b> trong <b>" + t + " phút</b>.<br>Đúng <b>+" + fmt(s.reward) + " xu</b> · Sai <b>−" + fmt(s.penalty) + " xu</b>";
}
function goHome() {
  clearGameTimers(); g = null; $("#in-name").value = ""; $("#name-err").textContent = ""; closeModal(); $("#fx").innerHTML = "";
  refreshStartInfo(); show("screen-start");
}
$("#btn-start").onclick = () => {
  const name = $("#in-name").value.trim().replace(/\s+/g, " ");
  if (!name) { $("#name-err").textContent = "Em hãy nhập tên trước khi bắt đầu nhé!"; $("#in-name").focus(); return; }
  ac(); sfx.click(); startGame(name);
};
$("#in-name").addEventListener("keydown", e => { if (e.key === "Enter") $("#btn-start").click(); });
$("#in-name").addEventListener("input", () => { $("#name-err").textContent = ""; });
$("#btn-home").onclick = goHome;
$("#btn-replay").onclick = () => { if (g) { ac(); startGame(g.name); } };

/* =====================================================================
   7) LƯỢT CHƠI
   ===================================================================== */
let g = null;   // trạng thái lượt chơi hiện tại
function clearGameTimers() { if (g) { clearInterval(g.timer); clearTimeout(g.endTimeout); clearTimeout(g.bannerTimeout); } $$(".warn-banner,.overlay").forEach(e => e.remove()); }

function startGame(name) {
  clearGameTimers(); closeModal(); $("#fx").innerHTML = "";
  // Chụp lại thiết lập & câu hỏi tại thời điểm bắt đầu: học sinh không thể thay đổi khi đang chơi
  const cfg = clone(state.settings), ranks = clone(state.ranks);
  let pool = clone(state.questions);
  if (!pool.length) { toast("Chưa có câu hỏi nào. Nhờ thầy cô thêm câu hỏi trong TEACHER MODE.", true); return goHome(); }
  if (cfg.shuffleQuestions) pool = shuffle(pool);
  pool = pool.slice(0, Math.max(1, Math.min(cfg.numQuestions, pool.length)));
  const items = pool.map(q => {
    const order = cfg.shuffleAnswers ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];   // order[k] = chỉ số gốc của đáp án hiển thị ở vị trí k
    return { question: q.question, answers: order.map(i => q.answers[i]), correct: order.indexOf(q.correctAnswer), explanation: q.explanation };
  });
  g = { name, cfg, ranks, items, i: 0, net: cfg.startWealth, correct: 0, wrong: 0, answered: 0, selected: null, locked: false, over: false, finished: false, warned: false, shownWealth: Math.max(0, cfg.startWealth), totalSec: Math.round(cfg.timeMinutes * 60) };
  $("#g-name").textContent = name; $("#g-total").textContent = items.length;
  $("#g-wealth").textContent = fmt(g.shownWealth);
  setDelta(null);
  $("#g-timer").classList.remove("warn");
  show("screen-game");
  renderQuestion();
  g.endAt = Date.now() + g.totalSec * 1000;
  g.timer = setInterval(tick, 200); tick();
}

function fmtTime(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function tick() {
  if (!g || g.finished || g.over) return;
  const rem = Math.max(0, Math.ceil((g.endAt - Date.now()) / 1000));
  if (rem !== g.lastRem) {
    g.lastRem = rem; $("#g-time").textContent = fmtTime(rem);
    if (rem <= 30) {
      $("#g-timer").classList.add("warn");
      if (!g.warned) { g.warned = true; sfx.warn(); showBanner("⚠ Còn 30 giây! Em nhanh tay nhé!"); }
      else if (rem <= 10 && rem > 0) sfx.tick();
    }
  }
  if (rem <= 0) finishGame("timeout");
}
function showBanner(t) {
  $$(".warn-banner").forEach(e => e.remove());
  const b = document.createElement("div"); b.className = "warn-banner"; b.textContent = t; document.body.appendChild(b);
  g.bannerTimeout = setTimeout(() => b.remove(), 3500);
}

function renderQuestion() {
  const it = g.items[g.i];
  g.selected = null; g.locked = false;
  $("#g-q").textContent = g.i + 1;
  $("#g-qno").textContent = "CÂU " + (g.i + 1);
  $("#g-bar").style.width = (g.answered / g.items.length * 100) + "%";
  $("#g-question").textContent = it.question;
  const box = $("#g-options"); box.innerHTML = "";
  it.answers.forEach((a, k) => {
    const b = document.createElement("button"); b.className = "opt"; b.dataset.k = k;
    b.innerHTML = '<span class="letter">' + LETTERS[k] + '</span><span class="txt"></span>'; $(".txt", b).textContent = a;
    b.onclick = () => selectOption(k);
    box.appendChild(b);
  });
  $("#g-actions").hidden = false; $("#g-feedback").hidden = true;
  const c = $("#g-confirm"); c.disabled = true; c.textContent = "XÁC NHẬN";
}
function selectOption(k) {
  if (!g || g.locked || g.finished || g.over) return;
  g.selected = k; sfx.click();
  $$("#g-options .opt").forEach(b => b.classList.toggle("selected", +b.dataset.k === k));
  const c = $("#g-confirm"); c.disabled = false; c.focus();
}
$("#g-confirm").onclick = confirmAnswer;

function confirmAnswer() {
  if (!g || g.locked || g.finished || g.over || g.selected === null) return;
  g.locked = true;                                  // khóa ngay: không thể trả lời lần hai
  const it = g.items[g.i], ok = g.selected === it.correct, cfg = g.cfg;
  const delta = ok ? cfg.reward : -cfg.penalty;
  g.net += delta; g.answered++; if (ok) g.correct++; else g.wrong++;
  const wealth = Math.max(0, g.net);
  $$("#g-options .opt").forEach(b => { const k = +b.dataset.k; b.disabled = true; b.classList.remove("selected"); if (k === it.correct) b.classList.add("right"); else if (k === g.selected) b.classList.add("wrong"); });
  $("#g-bar").style.width = (g.answered / g.items.length * 100) + "%";
  setDelta(delta); animateWealth(wealth);
  const wEl = $("#g-wallet"); wEl.classList.remove("bump", "shake"); void wEl.offsetWidth;
  if (ok) { sfx.right(); flyCoins($(".opt.right")); setTimeout(() => { if (g && !g.finished) { wEl.classList.add("bump"); } }, 700); }
  else { sfx.wrong(); wEl.classList.add("shake"); floatDelta(delta); }
  // phản hồi
  const praise = ["Chính xác!", "Giỏi lắm!", "Tuyệt vời!", "Quá xuất sắc!"][Math.floor(Math.random() * 4)];
  const last = g.i === g.items.length - 1;
  let h = '<div class="fb-title">' + (ok ? "✅ " + praise : "❌ Chưa đúng rồi!") + '</div>';
  h += '<div class="fb-line">' + (ok ? "Em được cộng <b>+" + fmt(cfg.reward) + " xu</b>." : "Em bị trừ <b>−" + fmt(cfg.penalty) + " xu</b>.") + ' Tài sản hiện tại: <b>' + fmt(wealth) + " xu</b>.</div>";
  if (!ok) h += '<div class="fb-line">Đáp án đúng là <b>' + LETTERS[it.correct] + ". " + esc(it.answers[it.correct]) + "</b></div>";
  if (it.explanation) h += '<div class="fb-line">💡 ' + esc(it.explanation) + "</div>";
  h += '<div class="fb-row"><span></span><button id="g-next" class="btn-gold">' + (last ? "XEM KẾT QUẢ" : "CÂU TIẾP THEO ▶") + "</button></div>";
  const fb = $("#g-feedback"); fb.className = "feedback " + (ok ? "ok" : "no"); fb.innerHTML = h; fb.hidden = false; $("#g-actions").hidden = true;
  const nx = $("#g-next"); nx.onclick = () => { if (last) finishGame("done"); else { g.i++; renderQuestion(); } };
  nx.focus();
  if (last) { g.over = true; clearInterval(g.timer); }   // đã làm xong 10 câu: dừng đồng hồ
}

/* ---- Ví tài sản & hiệu ứng ---- */
function setDelta(d) {
  const el = $("#g-delta"); el.className = "delta";
  if (d === null) { el.textContent = "Chưa có thay đổi"; return; }
  el.textContent = d === 0 ? "±0 xu" : (d > 0 ? "+" : "−") + fmt(Math.abs(d)) + " xu";
  el.classList.add(d > 0 ? "pos" : d < 0 ? "neg" : "x"); void el.offsetWidth; el.classList.add("pop");
}
function animateWealth(to) {
  const from = g.shownWealth, el = $("#g-wealth"), t0 = performance.now(), dur = 600, me = g;
  g.shownWealth = to;
  if (reduceMotion() || from === to) { el.textContent = fmt(to); return; }
  (function step(t) {
    if (g !== me) return;
    const p = Math.min(1, (t - t0) / dur); el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
  })(t0);
}
function flyCoins(fromEl) {
  if (reduceMotion() || !fromEl) return;
  const fx = $("#fx"), wr = $("#g-wallet-icon").getBoundingClientRect(), fr = fromEl.getBoundingClientRect();
  const ex = wr.left + wr.width / 2 - 14, ey = wr.top + wr.height / 2 - 14;
  for (let i = 0; i < 9; i++) {
    const c = document.createElement("div"); c.className = "fly-coin"; c.innerHTML = '<svg viewBox="0 0 40 40"><use href="#coin"/></svg>';
    const sx = fr.left + fr.width * (.2 + Math.random() * .6), sy = fr.top + fr.height / 2;
    c.style.left = sx + "px"; c.style.top = sy + "px"; fx.appendChild(c);
    const mx = (sx + ex) / 2 + (Math.random() - .5) * 200, my = Math.min(sy, ey) - 40 - Math.random() * 80;
    const a = c.animate([
      { transform: "translate(0,0) scale(.5)", opacity: 0 },
      { transform: "translate(" + (mx - sx) + "px," + (my - sy) + "px) scale(1.2)", opacity: 1, offset: .45 },
      { transform: "translate(" + (ex - sx) + "px," + (ey - sy) + "px) scale(.5)", opacity: .9 }
    ], { duration: 850 + Math.random() * 250, delay: i * 60, easing: "ease-in-out", fill: "backwards" });
    a.onfinish = () => c.remove();
  }
}
function floatDelta(d) {
  const r = $("#g-wallet-icon").getBoundingClientRect(), el = document.createElement("div");
  el.className = "float-delta"; el.textContent = "−" + fmt(Math.abs(d)); el.style.left = (r.left - 20) + "px"; el.style.top = (r.top + r.height) + "px";
  $("#fx").appendChild(el); setTimeout(() => el.remove(), 1300);
}

/* ---- Kết thúc lượt chơi ---- */
function finishGame(reason) {
  if (!g || g.finished) return;
  g.finished = true; g.over = true; clearInterval(g.timer); $$(".warn-banner").forEach(e => e.remove());
  if (reason === "timeout") {
    g.locked = true; sfx.timeup();
    const o = document.createElement("div"); o.className = "overlay"; o.textContent = "HẾT GIỜ!"; document.body.appendChild(o);
    g.endTimeout = setTimeout(() => { o.remove(); showResult(); }, 1700);
  } else showResult();
}
function showResult() {
  if (!g) return;
  const wealth = calcWealth(g.correct, g.wrong, g.cfg), rid = rankFor(wealth, g.ranks), rk = RANKS.find(r => r.id === rid);
  $("#r-badge").src = BADGES[rid]; $("#r-badge").alt = rk.name;
  $("#r-name").textContent = g.name; $("#r-rank").textContent = "Danh hiệu: " + rk.name;
  $("#r-answered").textContent = g.answered + " / " + g.items.length; $("#r-correct").textContent = g.correct; $("#r-wrong").textContent = g.wrong;
  $("#r-wealth").textContent = fmt(wealth) + " xu";
  $("#r-msg").textContent = rk.msg;
  $("#r-ladder").innerHTML = RANKS.map(r => '<div class="rank-card' + (r.id === rid ? " you" : "") + '">' + (r.id === rid ? '<span class="tag">CẤP CỦA EM</span>' : "") +
    '<img src="' + BADGES[r.id] + '" alt="' + esc(r.name) + '"><div class="range">' + esc(rangeText(r.id, g.ranks)) + "</div></div>").join("");
  show("screen-result");
  if (rid === "king") { sfx.fanfare(); coinRain(60); } else if (rid === "minister") { sfx.win(); coinRain(30); } else if (rid === "magistrate" || rid === "rich") { sfx.win(); coinRain(14); }
}
function coinRain(n) {
  if (reduceMotion()) return;
  const fx = $("#fx");
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"); c.className = "rain-coin"; c.innerHTML = '<svg viewBox="0 0 40 40"><use href="#coin"/></svg>';
    c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = (2.6 + Math.random() * 2.4) + "s"; c.style.animationDelay = (Math.random() * 2) + "s";
    c.style.transform = "scale(" + (.7 + Math.random() * .9) + ")"; fx.appendChild(c); setTimeout(() => c.remove(), 8000);
  }
}

/* ---- Phím tắt: A-D hoặc 1-4 để chọn đáp án ---- */
document.addEventListener("keydown", e => {
  if (!g || !$("#screen-game").classList.contains("active") || $("#modal-root").firstChild) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.ctrlKey || e.altKey || e.metaKey) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());

    '<div class="t-section"><b>Đổi mật khẩu giáo viên</b><div class="form-grid" style="margin-top:10px"><label class="field">Mật khẩu mới<input type="password" id="pw-new" autocomplete="new-password"></label><label class="field">Nhập lại mật khẩu mới<input type="password" id="pw-new2" autocomplete="new-password"></label></div><div class="row"><button class="btn-ghost sm" data-act="pw">Đặt mật khẩu mới</button></div>' +
    '<p class="t-note" style="margin:10px 0 0">Mật khẩu chỉ là lớp ngăn truy cập thông thường vì trò chơi chạy ngay trên máy tính, không phải bảo mật tuyệt đối.</p></div>' +
    '<div class="t-section"><b>Lưu ý về nơi lưu dữ liệu</b><p class="t-note" style="margin:4px 0 0">Thiết lập và câu hỏi được lưu trong trình duyệt của máy này (localStorage). Mở lại bằng cùng trình duyệt và cùng file thì vẫn còn. Máy khác hoặc trình duyệt khác cần nhập lại file JSON. Nếu xóa dữ liệu duyệt web, thiết lập sẽ mất.</p></div>';
}

/* ---- Xử lý thao tác trong Teacher Mode ---- */
$("#screen-teacher").addEventListener("input", e => {
  const el = e.target; if (!el.dataset.bind) return;
  const [grp, key] = el.dataset.bind.split(".");
  T[grp][key] = el.type === "checkbox" ? el.checked : (el.value === "" ? NaN : parseFloat(el.value));
  setDirty(true);
});
$("#screen-teacher").addEventListener("change", e => {
  if (e.target.id === "file-in") importFile(e.target.files[0]);
});
$("#screen-teacher").addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]"); if (tab) { tTab = tab.dataset.tab; $$(".t-tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tTab)); renderTab(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const i = +a.dataset.i, act = a.dataset.act;
  if (act === "save") saveAll();
  else if (act === "restore") restoreDefaults();
  else if (act === "exit") exitTeacher();
  else if (act === "q-add") editQuestion(-1);
  else if (act === "q-edit") editQuestion(i);
  else if (act === "q-del") deleteQuestion(i);
  else if (act === "q-up" || act === "q-down") { const j = act === "q-up" ? i - 1 : i + 1; [T.questions[i], T.questions[j]] = [T.questions[j], T.questions[i]]; setDirty(true); renderTab(); }
  else if (act === "export") exportJSON();
  else if (act === "import") $("#file-in").click();
  else if (act === "pw") changePassword();
});

function editQuestion(idx) {
  const q = idx >= 0 ? T.questions[idx] : { question: "", answers: ["", "", "", ""], correctAnswer: 0, explanation: "" };
  let h = '<label>Nội dung câu hỏi<textarea id="qe-q" rows="3">' + esc(q.question) + '</textarea></label><div style="font-weight:700;font-size:14px">Bốn phương án (chọn nút tròn ở phương án đúng)</div>';
  for (let k = 0; k < 4; k++) h += '<div class="ans-row"><label class="radio"><input type="radio" name="qe-c" value="' + k + '" ' + (q.correctAnswer === k ? "checked" : "") + '><span class="letter">' + LETTERS[k] + '</span></label><input type="text" id="qe-a' + k + '" value="' + esc(q.answers[k]) + '" placeholder="Phương án ' + LETTERS[k] + '"></div>';
  h += '<label>Giải thích ngắn (không bắt buộc)<input type="text" id="qe-ex" value="' + esc(q.explanation || "") + '"></label><p class="err" id="qe-err" role="alert"></p>';
  openModal({
    title: idx >= 0 ? "Sửa câu hỏi " + (idx + 1) : "Thêm câu hỏi mới", html: h, wide: true,
    buttons: [{ label: "Hủy", cls: "btn-ghost" }, {
      label: "Lưu câu hỏi", cls: "btn-gold sm", onClick: box => {
        const nq = { question: $("#qe-q", box).value.trim(), answers: [0, 1, 2, 3].map(k => $("#qe-a" + k, box).value.trim()), correctAnswer: +($("input[name=qe-c]:checked", box) || { value: -1 }).value, explanation: $("#qe-ex", box).value.trim() };
        if (!nq.question) { $("#qe-err", box).textContent = "Em chưa nhập nội dung câu hỏi."; return false; }
        if (nq.answers.some(a => !a)) { $("#qe-err", box).textContent = "Cần nhập đủ 4 phương án A, B, C, D."; return false; }
        if (nq.correctAnswer < 0) { $("#qe-err", box).textContent = "Hãy chọn đáp án đúng."; return false; }
        if (idx >= 0) T.questions[idx] = nq; else T.questions.push(nq);
        setDirty(true); renderTab();
      }
    }]
  });
}
function deleteQuestion(i) {
  openModal({
    title: "Xóa câu hỏi?", html: "<p>Câu " + (i + 1) + ": <b>" + esc(T.questions[i].question) + "</b></p><p>Thao tác này chỉ có hiệu lực sau khi bấm SAVE SETTINGS.</p>",
    buttons: [{ label: "Giữ lại", cls: "btn-ghost" }, { label: "Xóa", cls: "btn-red sm", onClick: () => { T.questions.splice(i, 1); setDirty(true); renderTab(); } }]
  });
}
function validateT() {
  const s = T.settings, r = T.ranks;
  if (!T.questions.length) return "Cần có ít nhất 1 câu hỏi.";
  if (!(s.timeMinutes >= 0.5 && s.timeMinutes <= 180)) return "Thời gian làm bài phải từ 0,5 đến 180 phút.";
  if (!(Number.isInteger(s.numQuestions) && s.numQuestions >= 1 && s.numQuestions <= 200)) return "Số câu hỏi mỗi lượt phải là số nguyên từ 1 trở lên.";
  if (!(Number.isInteger(s.reward) && s.reward >= 0)) return "Xu thưởng phải là số nguyên không âm.";
  if (!(Number.isInteger(s.penalty) && s.penalty >= 0)) return "Xu phạt phải là số nguyên không âm.";
  if (!(Number.isInteger(s.startWealth) && s.startWealth >= 0)) return "Tài sản khởi đầu phải là số nguyên không âm.";
  const ok = [r.king, r.minister, r.magistrate, r.rich].every(Number.isInteger) && r.king > r.minister && r.minister > r.magistrate && r.magistrate > r.rich && r.rich > 0;
  if (!ok) return "Các mức phân cấp phải là số nguyên và giảm dần: Vua > Đại thần > Quan huyện > Phú hộ > 0.";
  return null;
}
function saveAll() {
  const err = validateT(); if (err) { toast(err, true); return false; }
  state = clone(T); state.questions = state.questions.map(cleanQuestion);
  if (!persist(state)) { toast("Không lưu được vào trình duyệt (bị chặn lưu trữ). Thiết lập chỉ dùng được đến khi đóng trang.", true); return true; }
  setDirty(false); toast("Đã lưu thiết lập và câu hỏi."); return true;
}
function restoreDefaults() {
  openModal({
    title: "Khôi phục mặc định?", html: "<p>Toàn bộ câu hỏi, cài đặt, phân cấp và mật khẩu sẽ quay về như ban đầu (mật khẩu: <b>TEACHER2026</b>). Việc này được lưu ngay.</p>",
    buttons: [{ label: "Hủy", cls: "btn-ghost" }, {
      label: "Khôi phục", cls: "btn-red sm", onClick: () => { state = clone(DEFAULTS); T = clone(state); persist(state); dirty = false; renderTeacher(); toast("Đã khôi phục thiết lập ban đầu."); }
    }]
  });
}
function exitTeacher() {
  const out = () => { T = null; dirty = false; goHome(); };
  if (!dirty) return out();
  openModal({
    title: "Có thay đổi chưa lưu", html: "<p>Em muốn lưu các thay đổi trước khi thoát không?</p>", cancelable: true,
    buttons: [{ label: "Ở lại", cls: "btn-ghost" }, { label: "Thoát, không lưu", cls: "btn-ghost", onClick: () => { out(); } }, { label: "Lưu và thoát", cls: "btn-gold sm", onClick: () => { if (saveAll()) out(); else return false; } }]
  });
}
function exportJSON() {
  const data = { game: "The Royal Fortune Quest", version: 1, questions: T.questions };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "bo-cau-hoi-royal-fortune-quest.json"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Đã xuất " + T.questions.length + " câu hỏi.");
}
function importFile(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result), arr = Array.isArray(d) ? d : d.questions;
      if (!Array.isArray(arr) || !arr.length) throw new Error("Không tìm thấy danh sách câu hỏi trong file.");
      const bad = arr.findIndex(q => !validQuestion(q));
      if (bad >= 0) throw new Error("Câu số " + (bad + 1) + " trong file chưa đúng định dạng (cần câu hỏi, 4 phương án và correctAnswer từ 0 đến 3).");
      T.questions = arr.map(cleanQuestion); setDirty(true); renderTab(); toast("Đã nhập " + arr.length + " câu hỏi. Bấm SAVE SETTINGS để lưu.");
    } catch (e) { toast("Không nhập được: " + e.message, true); }
    const fi = $("#file-in"); if (fi) fi.value = "";
  };
  rd.readAsText(f, "utf-8");
}
function changePassword() {
  const a = $("#pw-new").value, b = $("#pw-new2").value;
  if (a.length < 4) return toast("Mật khẩu cần có ít nhất 4 ký tự.", true);
  if (a !== b) return toast("Hai lần nhập mật khẩu chưa giống nhau.", true);
  T.password = a; setDirty(true); $("#pw-new").value = ""; $("#pw-new2").value = ""; toast("Đã đặt mật khẩu mới. Bấm SAVE SETTINGS để lưu.");
}
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---- Khởi động ---- */
refreshSoundButtons(); refreshStartInfo();
</script>
</body>
</html>
